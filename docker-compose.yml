

services:
  # ── MongoDB ──
  mongodb:
    image: mongo:7
    container_name: digital-wedding-mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ── Backend (Express API) ─
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: digital-wedding-backend
    restart: unless-stopped
    ports:
      - "5004:5000"
    env_file:
      - ./Backend/.env
    environment:
      # Override MongoDB URI to use Docker service name
      MONGODB_URI: mongodb://mongodb:27017/digital-wedding
      # Override frontend URL for CORS (Docker frontend is on port 3000)
      FRONTEND_URL: http://192.168.112.199:3004
    volumes:
      # Persist uploaded files on the host
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # ── Frontend (Nginx serving Vite build) ──
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # This is baked into the JS bundle at build time
        VITE_API_BASE_URL: http://localhost:5004/api/v1/
    container_name: digital-wedding-frontend
    restart: unless-stopped
    ports:
      - "3004:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local
  backend-uploads:
    driver: local

networks:
  app-network:
    driver: bridge
